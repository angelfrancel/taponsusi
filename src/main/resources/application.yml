spring:
  application:
    name: taponsusi

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/taponsusi
    username: ${DB_USERNAME:taponsusi}
    password: ${DB_PASSWORD:taponsusi}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

taponsusi:
  jwt:
    secret: ${JWT_SECRET:change-this-in-env-CHANGE-THIS-IN-ENV-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  reservation:
    lock-timeout-ms: 2000
    window-minutes: 60
    safety-net-hours: 24

  waitlist:
    offer-window-minutes: 10

  messaging:
    retry-delay-ms: 300000
    maximum-attempts: 5

  facebook:
    app-secret: ${FACEBOOK_APP_SECRET:dev-placeholder-secret-CHANGE-IN-ENV}
    webhook-verify-token: ${FACEBOOK_WEBHOOK_VERIFY_TOKEN:dev-placeholder-token-CHANGE-IN-ENV}

  email:
    sendgrid-api-key: ${SENDGRID_API_KEY:dev-placeholder-sendgrid-key-CHANGE-IN-ENV}
    from-address: ${EMAIL_FROM_ADDRESS:noreply@taponsusi.dev}
    log-links-for-dev: ${EMAIL_LOG_LINKS_FOR_DEV:true}

logging:
  level:
    com.taponsusi: DEBUG
    org.hibernate.SQL: WARN